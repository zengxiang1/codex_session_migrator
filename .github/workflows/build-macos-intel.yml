name: Build macOS Intel app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"

      - name: Install build dependency
        run: python -m pip install "pyinstaller==6.16.0"

      - name: Run tests
        run: python -X dev -m unittest -v test_codex_session_migrator.py

      - name: Build Intel application bundle
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          test "$(uname -m)" = "x86_64"
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --target-arch x86_64 \
            --name CodexSessionMigrator \
            desktop_app.py

      - name: Verify, ad-hoc sign, and package
        run: |
          file dist/CodexSessionMigrator.app/Contents/MacOS/CodexSessionMigrator | tee architecture.txt
          grep -q "x86_64" architecture.txt
          codesign --force --deep --sign - dist/CodexSessionMigrator.app
          codesign --verify --deep --strict --verbose=2 dist/CodexSessionMigrator.app
          ditto -c -k --sequesterRsrc --keepParent \
            dist/CodexSessionMigrator.app \
            dist/CodexSessionMigrator-macOS-Intel-x86_64-v0.2.0.zip
          shasum -a 256 dist/CodexSessionMigrator-macOS-Intel-x86_64-v0.2.0.zip \
            > dist/CodexSessionMigrator-macOS-Intel-x86_64-v0.2.0.zip.sha256

      - name: Upload Intel Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexSessionMigrator-macOS-Intel-x86_64-v0.2.0
          path: |
            dist/CodexSessionMigrator-macOS-Intel-x86_64-v0.2.0.zip
            dist/CodexSessionMigrator-macOS-Intel-x86_64-v0.2.0.zip.sha256
          if-no-files-found: error
          retention-days: 30
